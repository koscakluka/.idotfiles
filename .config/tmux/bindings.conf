unbind C-b
set-option -g prefix C-b
bind-key C-b send-prefix

unbind r # Just in case future version binds this to something else
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux config"

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
# unbind  C-h
# bind C-h attach-session -t home
unbind C-l
bind C-l switch-client -l


# bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/TODO.md"

bind-key f display-popup -E "~/.local/bin/tmux-sessionizer"

bind-key n display-popup -w 60 -h 7 -E "$SHELL -lc 'printf \"New effort folder: \"; IFS= read -r name; [ -z \"\$name\" ] && exit 0; dir=\"\$HOME/efforts/\$name\"; mkdir -p \"\$dir\"; sess=\$(printf \"%s\" \"\$name\" | tr \" .\" \"__\"); tmux has-session -t \"\$sess\" 2>/dev/null || tmux new-session -ds \"\$sess\" -c \"\$dir\" \"[ -x ~/.local/bin/tmux-layouter ] && ~/.local/bin/tmux-layouter\"; tmux switch-client -t \"\$sess\"'"

bind-key u display-popup -w 65 -h 20 -x R -y T -E $SHELL -c "codex help 1> /dev/null; codeburn today; read -n 1 -s -r -p \"Press any key to close…\""

bind-key a split-window -h -c "#{pane_current_path}" "$SHELL -c '
  dir=$(
    {
      echo .
      find . -mindepth 1 -maxdepth 1 -type d \
        -not -name \".git\" \
        -not -name \"node_modules\" \
        2>/dev/null
    } | sort -u | fzf --reverse
  )

  if [ -n \"\$dir\" ]; then
    opencode \"\$dir\"
  fi
'"
