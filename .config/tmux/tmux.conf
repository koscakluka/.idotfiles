set-option -g default-terminal "tmux-256color"
# set -ga terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ",alacritty*:Tc"

set -s escape-time 0

set-option -g detach-on-destroy off
set -g allow-passthrough on

set -g mouse on # Consider removing this, I am not really using it, and when I do it's usually a mistype

set -g base-index 1
set-window-option -g pane-base-index 1

set -g history-file ~/.local/share/tmux/history

# This changes the session numbering to start from 1 based on
# https://www.reddit.com/r/tmux/comments/fsuy7e/comment/lz6rnpu
bind -T prefix s choose-tree -s -Z -K "#{?#{e|<:#{line},9},#{e|+:#{line},1},#{?#{e|<:#{line},36},M-#{a:#{e|+:97,#{e|-:#{line},10}}},}}"


# set -g @rose_pine_status_right_append_section '#(?client_prefix,#[fg=#333333]#[bold] - PREFIX - ,#{session_name}}'
set -g @rose_pine_status_right_append_section ''
set -g @rose_pine_status_right_prepend_section '' 
set -g @rose_pine_directory 'off'

source ~/.config/tmux/bindings.conf
# run ~/.config/tmux/plugins/rose-pine/rose-pine.tmux
source ~/.config/tmux/themes/iron-neon.conf
set -g @process_sidebar_pattern 'opencode|codex'
run ~/.config/tmux/plugins/process-sidebar/process-sidebar.tmux

# set -g @catppuccin_flavor 'mocha'
# run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

