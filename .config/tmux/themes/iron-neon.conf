# Iron Neon (dark, red-accent)

# Truecolor
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# Core palette
set -g status-style "bg=default,fg=#D7DCE2"
set -g message-style "bg=default,fg=#FF2A2A"
set -g message-command-style "bg=default,fg=#FF2A2A"

set -g pane-border-style "fg=#161616"
set -g pane-active-border-style "fg=#FF1B2D"

set -g mode-style "bg=#FF1B2D,fg=#000000"
set -g clock-mode-colour "#FF1B2D"

# Windows
setw -g window-status-style "bg=default,fg=#B7BEC7"
setw -g window-status-current-style "bg=default,fg=#FF2A2A"
setw -g window-status-current-format "#[fg=#FF2A2A,bold] #I:#W "
setw -g window-status-format " #I:#W "

# Status line content (matches tmux.conf)
set -g status-position top
set -g status-left ""
set -g window-status-separator "|"
set -g status-right-length 120

set -g status-right "#{?client_prefix,#[fg=#FF2A2A]#[bold] - PREFIX - ,#[fg=#D7DCE2]#{session_name}}"

# Copy mode matches
setw -g copy-mode-match-style "bg=#FF8A00,fg=#000000"
setw -g copy-mode-current-match-style "bg=#FF1B2D,fg=#000000"
